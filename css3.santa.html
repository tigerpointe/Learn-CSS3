<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2c3e50" />
    <meta name="keywords" content="css, html, santa, claus, christmas" />
    <meta name="description" content="Displays a CSS3 image of Santa Claus" />
    <meta name="author" content="TigerPointe Software, LLC" />
    <title>CSS3 Santa Claus</title>

    <!-- Page styles (not related to Santa Claus) -->
    <style type="text/css">
        body {
            align-items: center;
            background-color: #2c3e50;
            color: #fff;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
            font-size: 12px;
            gap: 10px;
            justify-content: center;
            margin: 0;
            /* 100vh for older browsers, usually having fixed heights */
            min-height: 100vh;
            /* 100svh for mobile browsers, allows for expanding toolbars */
            min-height: 100svh;
        }

        @keyframes rotate-top {
            0% {
                transform: perspective(550px) rotateY(30deg);
            }

            100% {
                transform: perspective(550px) rotateY(-30deg);
            }
        }

        @keyframes rotate-bottom {
            0% {
                transform: perspective(550px) rotateY(-30deg);
            }

            100% {
                transform: perspective(550px) rotateY(30deg);
            }
        }

        .sentiment {
            animation-direction: alternate;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            border: 2px solid #060;
            border-radius: 20px;
            padding: 5px;
            text-align: center;
            width: 320px;
        }

        .sentiment-top {
            animation-name: rotate-top;
        }

        .sentiment-bottom {
            animation-name: rotate-bottom;
        }

        .sentiment .text-keywords {
            font-family: cursive;
            font-size: 20px;
            padding-bottom: 5px;
        }

        @media print,
        (prefers-reduced-motion: reduce) {

            /* disables animation */
            .sentiment-top,
            .sentiment-bottom {
                animation: none !important;
            }
        }

        @media print {

            /* saves printer ink */
            body {
                background-color: #fff !important;
                color: #000 !important;
            }
        }
    </style>

    <!-- Santa Claus styles -->
    <style type="text/css">
        @keyframes eyes-blink {
            0% {
                transform: scaleY(0);
            }

            100% {
                transform: scaleY(1);
            }
        }

        @keyframes mustache-left-move {
            0% {
                transform: rotate(-20deg);
            }

            100% {
                transform: rotate(-5deg);
            }
        }

        @keyframes mustache-right-move {
            0% {
                transform: rotate(20deg);
            }

            100% {
                transform: rotate(5deg);
            }
        }

        @keyframes snowfall {
            0% {
                transform: translateY(-90px) rotate(0);
            }

            100% {
                transform: translateY(490px) rotate(720deg);
            }
        }

        .santa {
            border: 2px solid #060;
            border-radius: 20px;
            height: 400px;
            overflow: hidden;
            position: relative;
            width: 300px;
        }

        .santa .hat-base {
            background-color: #d63031;
            border-radius: 100px 100px 0 0;
            height: 70px;
            left: 65px;
            outline: 1px solid #d63031;
            position: absolute;
            top: 30px;
            width: 170px;
        }

        .santa .hat-pompon {
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 5px 5px #2c3e5088;
            height: 40px;
            left: 130px;
            position: absolute;
            top: 10px;
            width: 40px;
        }

        .santa .hat-cuff {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 5px 5px #2c3e5088;
            height: 40px;
            left: 50px;
            position: absolute;
            top: 90px;
            width: 200px;
        }

        .santa .face {
            background-color: #ffe0bd;
            border-radius: 0 0 80px 80px;
            height: 130px;
            left: 65px;
            position: absolute;
            top: 90px;
            width: 170px;
        }

        .santa .face .eye-left,
        .santa .face .eye-right {
            animation-direction: alternate;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-name: eyes-blink;
            /* timing advances zero to full in 15% of duration, then holds */
            animation-timing-function: linear(0, 1 15%, 1);
            background-color: #00f;
            border-radius: 50% 50% 30% 30%;
            height: 15px;
            outline: 1px solid #00f;
            position: absolute;
            top: 45px;
            width: 10px;
        }

        .santa .face .eye-left {
            left: 35px;
        }

        .santa .face .eye-right {
            right: 35px;
        }

        .santa .face .cheek-left,
        .santa .face .cheek-right {
            background-color: #ff9ff3;
            border-radius: 50%;
            height: 15px;
            opacity: 0.3;
            position: absolute;
            top: 55px;
            width: 25px;
        }

        .santa .face .cheek-left {
            left: 15px;
        }

        .santa .face .cheek-right {
            right: 15px;
        }

        .santa .face .nose {
            background-color: #ff7675;
            border-radius: 50%;
            height: 30px;
            left: 70px;
            outline: 1px solid #ff7675;
            position: absolute;
            top: 50px;
            width: 30px;
        }

        .santa .beard {
            background-color: #f5f6fa;
            border-radius: 15px 15px 115px 115px;
            box-shadow: 0 5px 5px #2c3e5088;
            height: 150px;
            left: 60px;
            position: absolute;
            top: 160px;
            width: 180px;
        }

        .santa .mustache-left,
        .santa .mustache-right {
            animation-direction: alternate;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            background-color: #fff;
            box-shadow: 0 5px 5px #2c3e5088;
            height: 35px;
            position: absolute;
            top: 150px;
            width: 65px;
        }

        .santa .mustache-left {
            animation-name: mustache-left-move;
            border-radius: 0 100px 0 100px;
            left: 90px;
        }

        .santa .mustache-right {
            animation-name: mustache-right-move;
            border-radius: 100px 0 100px 0;
            right: 90px;
        }

        .santa .coat {
            background-color: #d63031;
            border-radius: 100px 100px 20px 20px;
            height: 130px;
            left: 35px;
            outline: 1px solid #d63031;
            position: absolute;
            top: 255px;
            width: 230px;
        }

        .santa .coat .belt {
            background-color: #2d3436;
            border-radius: 5px;
            bottom: 30px;
            box-shadow: 0 5px 5px #2c3e5088;
            height: 30px;
            left: -5px;
            position: absolute;
            width: 240px;
        }

        .santa .coat .buckle {
            border: 5px solid #f1c40f;
            border-radius: 5px;
            bottom: 25px;
            box-shadow: 0 5px 5px #2c3e5088;
            box-sizing: border-box;
            height: 40px;
            left: 95px;
            position: absolute;
            width: 40px;
        }

        .santa .snowflakes {
            animation-direction: normal;
            animation-iteration-count: infinite;
            animation-name: snowfall;
            animation-timing-function: ease-in;
            color: #87cefa;
            position: absolute;
            text-align: center;
            text-shadow: 0 0 3px #ccc;
            top: -45px;
            width: 40px;
        }

        .santa .snowflake-01 {
            animation-duration: 8s;
            font-size: 28px;
            left: 10px;
        }

        .santa .snowflake-02 {
            animation-duration: 10s;
            font-size: 32px;
            left: 50px;
        }

        .santa .snowflake-03 {
            animation-duration: 12s;
            font-size: 22px;
            left: 90px;
        }

        .santa .snowflake-04 {
            animation-duration: 7s;
            font-size: 28px;
            left: 130px;
        }

        .santa .snowflake-05 {
            animation-duration: 13s;
            font-size: 22px;
            left: 170px;
        }

        .santa .snowflake-06 {
            animation-duration: 11s;
            font-size: 32px;
            left: 210px;
        }

        .santa .snowflake-07 {
            animation-duration: 9s;
            font-size: 28px;
            left: 250px;
        }

        @media print,
        (prefers-reduced-motion: reduce) {

            /* disables animation */
            .santa .face .eye-left,
            .santa .face .eye-right,
            .santa .mustache-left,
            .santa .mustache-right,
            .santa .snowflakes {
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- top -->
    <div class="sentiment sentiment-top">
        <div>Warmest thoughts and best wishes</div>
        <div>for a wonderful Christmas season.</div>
    </div>

    <!-- santa, hidden from screen readers -->
    <div class="santa" aria-hidden="true">

        <!-- coat -->
        <div class="coat">
            <div class="belt"></div>
            <div class="buckle"></div>
        </div>

        <!-- face -->
        <div class="face">
            <div class="eye-left"></div>
            <div class="eye-right"></div>
            <div class="cheek-left"></div>
            <div class="cheek-right"></div>
            <div class="nose"></div>
        </div>

        <!-- beard -->
        <div class="beard"></div>
        <div class="mustache-left"></div>
        <div class="mustache-right"></div>

        <!-- hat -->
        <div class="hat-base"></div>
        <div class="hat-pompon"></div>
        <div class="hat-cuff"></div>

        <!-- snowflakes -->
        <div class="snowflakes snowflake-01">&#10052;</div>
        <div class="snowflakes snowflake-02">&#10052;</div>
        <div class="snowflakes snowflake-03">&#10052;</div>
        <div class="snowflakes snowflake-04">&#10052;</div>
        <div class="snowflakes snowflake-05">&#10052;</div>
        <div class="snowflakes snowflake-06">&#10052;</div>
        <div class="snowflakes snowflake-07">&#10052;</div>

    </div>

    <!-- bottom -->
    <div class="sentiment sentiment-bottom">
        <div>May</div>
        <div class="text-keywords">Peace, Happiness &amp; Prosperity</div>
        <div>follow you always.</div>
    </div>

</body>

</html>
